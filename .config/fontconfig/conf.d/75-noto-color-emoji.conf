<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Strip ASCII digits, # and * from Noto Color Emoji so plain numbers
       never render as keycap emoji when the emoji font is consulted. -->
  <match target="scan">
    <test name="family" compare="eq"><string>Noto Color Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x0023</int><int>0x0023</int></range>
          <range><int>0x002a</int><int>0x002a</int></range>
          <range><int>0x0030</int><int>0x0039</int></range>
        </charset>
      </minus>
    </edit>
  </match>
  <!-- Text font FIRST, emoji second: emoji codepoints still resolve to
       Noto Color Emoji before icon fonts (Font Awesome), but Latin never
       lands on the emoji font. The old emoji-first form blanked text in
       any app that takes fontconfig's first match literally (dms notepad,
       assorted Qt surfaces) — 2026-08-14. Requires noto-fonts installed. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>emoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
